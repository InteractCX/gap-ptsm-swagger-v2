openapi: 3.0.3

info:
  title: Sierra ↔ PTSM Event Integration API — Production
  version: 3.0.0
  description: |
    Bidirectional event integration between the Sierra bot platform and the
    PTSM (BYOC middleware) service that bridges to NiCE CXone (agent leg of
    the conversation).

    During the bot-only phase, every turn — whether typed by the user or
    generated by the bot — is sent to PTSM individually and in real time via
    `ON_BOT_MESSAGE` as soon as it is produced. After escalation, the
    user's messages are streamed individually via `ON_USER_MESSAGE`
    instead. PTSM publishes each one into the NiCE BYOC channel as it
    arrives, so the NiCE thread is populated live instead of being
    replayed after the fact.

    `ON_BOT_CONVERSATION_COMPLETED` (S01) and `ON_ESCALATION` (S02) keep a
    `transcript` field, but it only carries trailing message(s) not already
    streamed individually (this may be the full remaining tail or just the
    final message; PTSM treats `transcript` entries as idempotent via
    `messageId`, same as individually streamed messages, so re-sending an
    already-streamed message here is harmless).

    Which of S01 / S02 fires depends only on the resolution outcome — never
    both: bot resolves the conversation → `ON_BOT_CONVERSATION_COMPLETED`;
    bot fails to resolve → `ON_ESCALATION` instead. Both carry the same
    shape (`customer`, `customFields`, `transcript`) and the same
    `customFields` set.

    ## Scope of this contract

    Only the Sierra ↔ PTSM event contract is defined here. PTSM's
    integration with NiCE DFO / Studio / BYOC channel webhooks is a separate
    internal contract and is out of scope for this file.

    Explicitly out of scope:
    - `ON_VISITOR_INACTIVITY`.
    - `ON_MESSAGE_WITH_ATTACHMENT` (S06) — merged into `ON_USER_MESSAGE` (S05).
    - `ON_MESSAGE_WITH_ATTACHMENT` (P07) — merged into `ON_AGENT_MESSAGE` (P05).
    - `ON_CASE_UPDATE` only covers `resolved` / `closed` (not open / pending /
      escalated).

    ## Identity model

    - NiCE `liveAgentThreadId` = Sierra's `botThreadId` value (same for
      existing and guest users).

    ## Flow overview

    ```
    Sierra Bot  ──POST /events──►  PTSM Middleware  ──►  NiCE CXone (agent leg)
    Sierra Bot  ◄──POST /webhooks/events──  PTSM Middleware  ◄──  NiCE CXone
    ```

    1. As soon as the user starts chatting with Sierra, every turn of the
       bot-only phase — user or bot — is streamed to PTSM individually and
       in real time via `ON_BOT_MESSAGE`, and PTSM publishes each one into
       the NiCE BYOC channel as it arrives.
    2. When the bot conversation ends, Sierra sends exactly one of:
       - `ON_BOT_CONVERSATION_COMPLETED` (bot resolved it), or
       - `ON_ESCALATION` (bot could not resolve it, live agent needed)

       Both carry `customer` + `customFields` + a `transcript` of any
       trailing message(s) not already streamed individually.
    3. PTSM fires `ON_CONTACT_QUEUED` → Sierra shows queue status
       (`waitTime` included).
    4. PTSM fires `ON_CONNECT_TO_LIVE_AGENT` when an agent connects.
    5. Sierra continues relaying user messages as `ON_USER_MESSAGE`; user
       typing as `ON_USER_TYPING`.
    6. PTSM fires `ON_AGENT_MESSAGE` / `ON_AGENT_TYPING` for agent activity.
    7. If transferred, PTSM fires `ON_TRANSFER`.
    8. PTSM fires `ON_CASE_UPDATE` (`resolved` or `closed`) → Sierra resumes
       bot mode.
    9. User/Sierra ends the session with `ON_CLOSE_SESSION`.

    ### Authentication

    - **Sierra → PTSM** (`POST /events`): OAuth 2.0 (API call).
    - **PTSM → Sierra** (`POST /webhooks/events`): HMAC-signed request
      (webhook). See `HmacSignature` security scheme.
    - Key rotation: 12 months.

    ### Retry policy

    - PTSM retries delivery to NiCE 3 times on failure.
    - PTSM retries delivery to Sierra 3 times on failure (exponential
      backoff recommended).

    ### Scale / deployment (context only, not part of the wire contract)

    - Single PROD PTSM environment (multi-AZ: 2 AZs in Azure West + 1
      active-active DR AZ in Azure East).
    - Scalability target: 1900 concurrent chats (including bot conversations).

servers:
  - url: https://ptsm.interactcx.com/v3
    description: Production PTSM service (single PROD environment)

# ─────────────────────────────────────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────────────────────────────────────
security:
  - OAuth2ClientCredentials: []

components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: >
        Used by Sierra when calling PTSM (`POST /events`). Sierra exchanges
        its client ID and secret for a bearer token at `POST /oauth/token`
        (TTL 3600 seconds) and presents it as
        `Authorization: Bearer <access_token>` on every call to `/events`.
        Client credentials rotate every 12 months.
      flows:
        clientCredentials:
          tokenUrl: https://ptsm.interactcx.com/oauth/token
          scopes:
            events:write: Submit Sierra events to PTSM

    HmacSignature:
      type: apiKey
      in: header
      name: X-PTSM-Signature
      description: >
        Used by PTSM when calling Sierra's webhook (`POST /webhooks/events`).
        HMAC-SHA256 signature computed over the raw request body using a
        shared secret.

  # ───────────────────────────────────────────────────────────────────────────
  # Shared envelope schemas
  # ───────────────────────────────────────────────────────────────────────────
  schemas:

    # ── Common envelope fields ──────────────────────────────────────────────

    CustomerIdentity:
      type: object
      description: >
        End-user identity forwarded to NiCE. `email` may be blank for
        guest users.
      required:
        - id
      properties:
        id:
          type: string
          description: >
            Customer ID provided by Sierra. Must remain the same for a
            given user across all their interactions/events — not
            regenerated per event or per session.
          example: "user-4421"
        username:
          type: string
          example: "john.doe"
        firstName:
          type: string
          description: Populated as first name in the NiCE case.
          example: "John"
        lastName:
          type: string
          description: Populated as last name in the NiCE case.
          example: "Doe"
        email:
          type: string
          format: email
          description: Blank for guest users.
          example: "john.doe@gap.com"

    Attachment:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          example: "https://cdn.example.com/uploads/damage.jpg"
        friendlyName:
          type: string
          example: "damage.jpg"

    TranscriptEntry:
      type: object
      description: >
        A single trailing message attached to `ON_BOT_CONVERSATION_COMPLETED`
        / `ON_ESCALATION` — i.e. a message not already streamed individually
        via `ON_BOT_MESSAGE`.
      required:
        - messageId
        - role
        - text
        - timestamp
      properties:
        messageId:
          type: string
          example: "msg-0001"
        role:
          type: string
          enum: [USER, BOT]
          example: "USER"
        text:
          type: string
          example: "I have a problem with my order."
        timestamp:
          type: string
          format: date-time
          example: "2026-04-21T10:05:30.000Z"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    CustomFields:
      type: object
      description: >
        Salesforce-sourced fields mapped into NiCE case custom fields.
      additionalProperties: false
      properties:
        Bot_Only_Duration__c:
          type: string
        Brand__c:
          type: string
        Case_Sub_Origin__c:
          type: string
        Chatbot_Name__c:
          type: string
          example: "Sierra"
        ChatInitiationPage__c:
          type: string
        CustomerId__c:
          type: string
        Date_Time_Assigned__c:
          type: string
          format: date-time
        IP_Address_on_Case__c:
          type: string
        IsEscalated:
          type: boolean
        Language:
          type: string
        Last_Assigned_Queue__c:
          type: string
          description: Used as the NiCE skill ID.
          example: "13902402"
        LiveAgent_Email__c:
          type: string
        LiveAgent_FirstName__c:
          type: string
        LiveAgent_LastName__c:
          type: string
        Market__c:
          type: string
        Order_Date__c:
          type: string
        Order_Number__c:
          type: string
        Origin:
          type: string
        Outcome__c:
          type: string
        Priority:
          type: string
        Product_Id__c:
          type: string
        Product_Name__c:
          type: string
        Rep_Comments__c:
          type: string
        Subject:
          type: string
        Subtype__c:
          type: string
        Transfer_Reason__c:
          type: string
        Type:
          type: string
        CardholderStatus__c:
          type: string
        Client_Phone__c:
          type: string
        External_Customer_ID__c:
          type: string
        Phone_Case_Handle_Time__c:
          type: string
        RewardTier__c:
          type: string
        SalesforceCaseId__c:
          type: string

    # ─────────────────────────────────────────────────────────────────────────
    # SIERRA → PTSM  event payloads
    # ─────────────────────────────────────────────────────────────────────────

    BotConversationCompletedPayload:
      type: object
      title: "S01 — Bot Conversation Completed"
      description: >
        Sent when the bot resolves the conversation without escalation.
        `transcript` holds only trailing message(s) not already streamed via
        `ON_BOT_MESSAGE`. `customFields` uses the exact same shape as
        `ON_ESCALATION`'s.
      required:
        - customer
      properties:
        customer:
          $ref: "#/components/schemas/CustomerIdentity"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        customFields:
          $ref: "#/components/schemas/CustomFields"

    EscalationRequestPayload:
      type: object
      title: "S02 — Escalation Request"
      description: >
        Sent instead of `ON_BOT_CONVERSATION_COMPLETED` when the bot fails
        to resolve the conversation and a live agent is needed. Sierra
        provides a skill ID via `customFields.Last_Assigned_Queue__c`.
        `customFields` uses the exact same shape as
        `ON_BOT_CONVERSATION_COMPLETED`'s. `transcript` holds only trailing
        message(s) not already streamed via `ON_BOT_MESSAGE`.
      required:
        - customer
      properties:
        customer:
          $ref: "#/components/schemas/CustomerIdentity"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        customFields:
          $ref: "#/components/schemas/CustomFields"

    SessionClosedPayload:
      type: object
      title: "S04 — Close Session"
      required:
        - closedBy
      properties:
        closedBy:
          type: string
          enum: [USER, SYSTEM, TIMEOUT]
          example: "USER"
        reason:
          type: string
          example: "User exited the chat window."

    UserMessagePayload:
      type: object
      title: "S05 — On User Message (with optional attachment)"
      description: >
        Sent immediately whenever the user sends a message after
        escalation (live-agent phase). S06 (message with attachment) is
        merged into this event. `role` is implied by the
        `ON_USER_MESSAGE` event type.
      required:
        - customer
        - messageId
        - text
        - timestamp
      properties:
        customer:
          $ref: "#/components/schemas/CustomerIdentity"
        messageId:
          type: string
          description: Not used by PTSM logic — logging/idempotency only.
          example: "msg-0192"
        text:
          type: string
          example: "Here is a photo of the damage."
        timestamp:
          type: string
          format: date-time
          example: "2026-04-21T10:06:10.000Z"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    UserTypingPayload:
      type: object
      title: "S07 — On User Typing"
      description: >
        `botThreadId` (envelope-level) is used to identify the active
        thread — no `customer` needed on this payload.
      required:
        - action
      properties:
        action:
          type: string
          enum: [isTypingOn, isTypingOff]
          example: "isTypingOn"

    BotMessagePayload:
      type: object
      title: "S08 — On Bot Message"
      description: >
        Streams the message interaction between the user and the bot
        during the bot-only phase — every turn, from either party, sent
        immediately as it happens, right up until `ON_ESCALATION` or
        `ON_BOT_CONVERSATION_COMPLETED` closes out that phase. `transcript`
        carries the streamed message(s) as `TranscriptEntry` objects, whose
        `role` is `USER` or `BOT` depending on who sent it — the same entry
        shape used by S01/S02's trailing `transcript`, so PTSM can
        reconcile a streamed message against a later replay by `messageId`
        + `role` alone. `customer` is included so PTSM has the customer
        identity for NiCE case fields on this thread.
      required:
        - customer
        - transcript
      properties:
        customer:
          $ref: "#/components/schemas/CustomerIdentity"
        transcript:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TranscriptEntry"

    # ─────────────────────────────────────────────────────────────────────────
    # PTSM → SIERRA  webhook payloads
    # ─────────────────────────────────────────────────────────────────────────

    ContactQueuedPayload:
      type: object
      title: "P01 — On Contact Queued"
      description: >
        `waitTime` is required alongside `contactId`.
      required:
        - contactId
        - waitTime
      properties:
        contactId:
          type: string
          description: Live agent contact ID for the NiCE contact.
          example: "12345678"
        queueName:
          type: string
          description: Skill name for the live contact.
          example: "claims_en"
        waitTime:
          type: integer
          description: Estimated wait time for the queue, in seconds.
          example: 139

    ConnectToLiveAgentPayload:
      type: object
      title: "P02 — On Connect To Live Agent"
      required:
        - agentId
      properties:
        agentId:
          type: string
          example: "18923"
        agentName:
          type: string
          example: "John Smith"

    TransferPayload:
      type: object
      title: "P03 — On Transfer"
      description: P02 (`ON_CONNECT_TO_LIVE_AGENT`) is triggered again after this event.
      required:
        - newAgentId
      properties:
        newAgentId:
          type: string
          example: "203244"
        newAgentName:
          type: string
          example: "Michael Smith"

    CaseUpdatePayload:
      type: object
      title: "P04 — On Case Update"
      description: >
        Only `resolved` and `closed` are in scope (not open / pending /
        escalated). Both cause Sierra to close the session.
      required:
        - newStatus
      properties:
        newStatus:
          type: string
          enum: [resolved, closed]
          example: "resolved"

    AgentMessagePayload:
      type: object
      title: "P05 — On Agent Message (with optional attachment)"
      description: >
        P07 (message with attachment) is merged into this event.
      required:
        - messageId
        - text
      properties:
        messageId:
          type: string
          example: "138913"
        agentId:
          type: string
          example: "20394"
        text:
          type: string
          example: "Please see this policy for returns"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    AgentTypingPayload:
      type: object
      title: "P06 — On Agent Typing"
      required:
        - action
      properties:
        agentId:
          type: string
          example: "18923"
        action:
          type: string
          enum: [isTypingOn, isTypingOff]
          example: "isTypingOn"

    # ─────────────────────────────────────────────────────────────────────────
    # Full discriminated event types
    # ─────────────────────────────────────────────────────────────────────────

    SierraEvent:
      type: object
      required:
        - eventId
        - eventType
        - timestamp
        - botThreadId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
          description: For logging only.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        eventType:
          type: string
          description: For logging only. Discriminator for payload type.
          enum:
            - ON_BOT_CONVERSATION_COMPLETED
            - ON_ESCALATION
            - ON_CLOSE_SESSION
            - ON_USER_MESSAGE
            - ON_BOT_MESSAGE
            - ON_USER_TYPING
        timestamp:
          type: string
          format: date-time
          description: For logging only. ISO 8601, millisecond precision, UTC.
          example: "2026-04-21T10:12:00.000Z"
        botThreadId:
          type: string
          description: >
            Sierra's conversation ID. Also used directly as the NiCE
            `liveAgentThreadId`.
          example: "31913901"
        payload:
          oneOf:
            - $ref: "#/components/schemas/BotConversationCompletedPayload"
            - $ref: "#/components/schemas/EscalationRequestPayload"
            - $ref: "#/components/schemas/SessionClosedPayload"
            - $ref: "#/components/schemas/UserMessagePayload"
            - $ref: "#/components/schemas/BotMessagePayload"
            - $ref: "#/components/schemas/UserTypingPayload"

    PTSMEvent:
      type: object
      required:
        - eventId
        - eventType
        - timestamp
        - botThreadId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        eventType:
          type: string
          description: Discriminator for payload type.
          enum:
            - ON_CONTACT_QUEUED
            - ON_CONNECT_TO_LIVE_AGENT
            - ON_TRANSFER
            - ON_CASE_UPDATE
            - ON_AGENT_MESSAGE
            - ON_AGENT_TYPING
        timestamp:
          type: string
          format: date-time
          example: "2026-04-21T10:12:00.000Z"
        botThreadId:
          type: string
          description: Sierra's thread identifier.
          example: "31913901"
        payload:
          oneOf:
            - $ref: "#/components/schemas/ContactQueuedPayload"
            - $ref: "#/components/schemas/ConnectToLiveAgentPayload"
            - $ref: "#/components/schemas/TransferPayload"
            - $ref: "#/components/schemas/CaseUpdatePayload"
            - $ref: "#/components/schemas/AgentMessagePayload"
            - $ref: "#/components/schemas/AgentTypingPayload"

    # ─────────────────────────────────────────────────────────────────────────
    # Response schemas
    # ─────────────────────────────────────────────────────────────────────────

    AckResponse:
      type: object
      description: Synchronous acknowledgement returned by PTSM after receiving a Sierra event.
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
        liveAgentThreadId:
          type: string
          description: >
            Thread ID on the NiCE platform. Same value as the request's
            `botThreadId`.
          example: "31913901"
        liveAgentContactId:
          type: string
          description: >
            Contact ID on the NiCE platform. Returned on all Sierra-event
            acknowledgements.
          example: "12891849924"
        errorMessage:
          type: string
          description: Optional error message.
          example: "Bearer token is missing or expired."

    WebhookAckResponse:
      type: object
      description: Response Sierra returns to PTSM after receiving a webhook event.
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
        errorMessage:
          type: string

    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
        - requestId
      properties:
        errorCode:
          type: string
          example: "VALIDATION_ERROR"
        errorMessage:
          type: string
          example: "Field botThreadId is required."
        requestId:
          type: string
          example: "req-7f2a91cc"

    # ─────────────────────────────────────────────────────────────────────────
    # OAuth 2.0 token endpoint schemas
    # ─────────────────────────────────────────────────────────────────────────

    OAuthTokenRequest:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          example: "client_credentials"
        client_id:
          type: string
          example: "sierra-gap-prod"
        client_secret:
          type: string
          format: password
        scope:
          type: string
          default: "events:write"
          example: "events:write"

    OAuthTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          enum: [Bearer]
          example: "Bearer"
        expires_in:
          type: integer
          description: Token TTL in seconds.
          example: 3600
        scope:
          type: string
          example: "events:write"

    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "invalid_client"
        error_description:
          type: string
          example: "Client authentication failed."

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────

tags:
  - name: Auth
    description: OAuth 2.0 client-credentials token issuance.
  - name: Sierra Events
    description: Endpoints called **by Sierra** to send events to PTSM. OAuth 2.0 secured.
  - name: PTSM Webhooks
    description: Endpoints hosted **by Sierra** that PTSM calls to deliver events. HMAC-signed.

paths:

  # ── Auth ────────────────────────────────────────────────────────────────────

  /oauth/token:
    post:
      tags: [Auth]
      summary: Issue an access token (client credentials)
      operationId: issueAccessToken
      security: []
      description: >
        Sierra exchanges its client ID and secret for a bearer token. Token
        TTL is 3600 seconds. Credentials rotate every 12 months.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
            example:
              grant_type: "client_credentials"
              client_id: "sierra-gap-prod"
              client_secret: "••••••••••••••••"
              scope: "events:write"
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
              example:
                access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                token_type: "Bearer"
                expires_in: 3600
                scope: "events:write"
        "401":
          description: Invalid client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: "invalid_client"
                error_description: "Client authentication failed."

  # ── Sierra → PTSM ──────────────────────────────────────────────────────────

  /events:
    post:
      tags: [Sierra Events]
      summary: Send event from Sierra to PTSM
      operationId: sendEvent
      security:
        - OAuth2ClientCredentials: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SierraEvent"
            examples:

              on_escalation:
                summary: "S02. Escalation Request"
                value:
                  eventId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  eventType: "ON_ESCALATION"
                  timestamp: "2026-04-21T10:12:00.000Z"
                  botThreadId: "31913901"
                  payload:
                    customer:
                      id: "user-4421"
                      username: "john.doe"
                      firstName: "John"
                      lastName: "Doe"
                      email: "john.doe@gap.com"
                    transcript:
                      - messageId: "msg-0004"
                        role: "USER"
                        text: "Here is a photo of the damage."
                        timestamp: "2026-04-21T10:06:10.000Z"
                        attachments:
                          - url: "https://cdn.example.com/uploads/damage.jpg"
                            friendlyName: "damage.jpg"
                    customFields:
                      Bot_Only_Duration__c: "150"
                      Brand__c: "Gap"
                      Case_Sub_Origin__c: "Chat"
                      Chatbot_Name__c: "Sierra"
                      ChatInitiationPage__c: "https://www.gap.com/cart"
                      CustomerId__c: "user-4421"
                      Date_Time_Assigned__c: "2026-04-21T10:12:03.000Z"
                      IP_Address_on_Case__c: "203.0.113.42"
                      IsEscalated: true
                      Language: "en-US"
                      Last_Assigned_Queue__c: "13902402"
                      LiveAgent_Email__c: ""
                      LiveAgent_FirstName__c: ""
                      LiveAgent_LastName__c: ""
                      Market__c: "US"
                      Order_Date__c: "2026-04-15"
                      Order_Number__c: "ORD-12345"
                      Origin: "Chat"
                      Outcome__c: ""
                      Priority: "Medium"
                      Product_Id__c: "PROD-9981"
                      Product_Name__c: "Slim Fit Jeans"
                      Rep_Comments__c: ""
                      Subject: "Damaged item on recent order"
                      Subtype__c: "Damaged Product"
                      Transfer_Reason__c: ""
                      Type: "Order Issue"
