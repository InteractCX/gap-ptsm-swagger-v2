                liveAgentThreadId: "31913901"
                liveAgentContactId: "12891849924"
        "400":
          description: Malformed JSON or missing required envelope fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errorCode: "MALFORMED_REQUEST"
                errorMessage: "Request body is not valid JSON."
                requestId: "req-7f2a91cc"
        "401":
          description: Missing or invalid OAuth 2.0 token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errorCode: "UNAUTHORIZED"
                errorMessage: "Bearer token is missing or expired."
                requestId: "req-7f2a91cd"
        "409":
          description: >
            Duplicate event. An event with this `eventId` was already
            processed. Sierra SHOULD treat this as success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
              example:
                status: "REJECTED"
                errorMessage: "This eventId was already processed."
        "422":
          description: Valid JSON but invalid business logic (e.g. missing customer.id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errorCode: "VALIDATION_ERROR"
                errorMessage: "Payload validation failed."
                requestId: "req-7f2a91ce"
        "500":
          description: Unexpected PTSM or NiCE error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errorCode: "INTERNAL_ERROR"
                errorMessage: "NiCE CXone API returned an unexpected error."
                requestId: "req-7f2a91cf"

  # ── PTSM → Sierra (webhook) ─────────────────────────────────────────────────

  /webhooks/events:
    post:
      tags: [PTSM Webhooks]
      summary: Receive event from PTSM (webhook endpoint hosted by Sierra)
      operationId: receiveWebhook
      description: |
        **This endpoint is implemented by Sierra, not PTSM.**

        PTSM calls this URL when NiCE CXone produces events (agent messages,
        agent assignment, case updates, transfers). Requests are HMAC-signed
        (see `HmacSignature` security scheme). PTSM retries delivery up to 3
        times on failure.
      security:
        - HmacSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PTSMEvent"
            examples:

              on_contact_queued:
                summary: "P01. Contact Queued"
                value:
                  eventId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  eventType: "ON_CONTACT_QUEUED"
                  timestamp: "2026-04-21T10:12:03.000Z"
                  botThreadId: "31913901"
                  payload:
                    contactId: "12345678"
                    queueName: "Customer Support EN"
                    waitTime: 139

              on_connect_to_live_agent:
                summary: "P02. Connect To Live Agent"
                value:
                  eventId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  eventType: "ON_CONNECT_TO_LIVE_AGENT"
                  timestamp: "2026-04-21T10:14:00.000Z"
                  botThreadId: "31913901"
                  payload:
                    agentId: "18923"
                    agentName: "John Smith"

              on_transfer:
                summary: "P03. Transfer"
                value:
                  eventId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  eventType: "ON_TRANSFER"
                  timestamp: "2026-04-21T10:20:00.000Z"
                  botThreadId: "31913901"
                  payload:
                    newAgentId: "203244"
                    newAgentName: "Michael Smith"

              on_case_update:
                summary: "P04. Case Update"
                value:
                  eventId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  eventType: "ON_CASE_UPDATE"
                  timestamp: "2026-04-21T10:20:00.000Z"
                  botThreadId: "31913901"
                  payload:
                    newStatus: "resolved"

              on_agent_message:
                summary: "P05. Agent Message"
                value:
                  eventId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  eventType: "ON_AGENT_MESSAGE"
                  timestamp: "2026-04-21T10:15:00.000Z"
                  botThreadId: "31913901"
                  payload:
                    messageId: "138913"
                    agentId: "20394"
                    text: "Please review the attached policy document."
                    attachments:
                      - url: "https://cdn.platform.example.com/files/policy.pdf"
                        friendlyName: "returnPolicy.pdf"

              on_agent_typing:
                summary: "P06. Agent Typing"
                value:
                  eventId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  eventType: "ON_AGENT_TYPING"
                  timestamp: "2026-04-21T10:14:30.000Z"
                  botThreadId: "31913901"
                  payload:
                    action: "isTypingOn"

      responses:
        "200":
          description: Webhook received and acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAckResponse"
              example:
                status: "ACCEPTED"
        "401":
          description: HMAC signature missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAckResponse"
              example:
                status: "REJECTED"
                errorMessage: "Invalid HMAC signature."
        "500":
          description: Sierra internal error. PTSM will retry delivery (up to 3 attempts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAckResponse"
              example:
                status: "REJECTED"
                errorMessage: "Internal server error."
